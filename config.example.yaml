# claw-assistant Phase 1 示例配置
# 复制为 config.yaml 后按需修改

server:
  host: "0.0.0.0"
  port: 8080

# 宪法规则：forbid=禁止执行的工具名；restrict=必须配置 require_approval 的工具；intent_deviation=可选意图偏差分
constitution:
  forbid: []   # 例如: ["delete_user_data"]
  allow: []
  restrict: []  # 例如: [{ action: "content", require_human: true }]
  # 意图偏差分：enabled 且 score > threshold 则拦截；stub_score 仅测试用，后续可接 LLM
  intent_deviation:
    enabled: false
    threshold: 0.5
    # stub_score: 0.0  # 测试时设为 1.0 可强制拦截

# World Checkpoint：偏差阈值与延时（秒）
checkpoint:
  threshold: 0.5    # 相对偏差超过此值则写复盘
  delay_seconds: 0 # 0=立即校验，>0=延时后校验

# channel：experimental 默认免审批（仅执行并记录），main 仍按 limb require_approval
channels:
  experimental:
    require_approval: false  # true 则 experimental 也需审批

limbs:
  content:
    endpoint: "http://localhost:8080/limb/content"  # stub 由 daemon 自身提供
    require_approval: true
    priority: 5
    # checkpoint: "content_stub"  # 可选：启用 stub 校验器，params 可传 expectedWorldState，result 可含 mock_actual
